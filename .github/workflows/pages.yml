name: Check and publish practice app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_AUDIOTOOL_CLIENT_ID: ${{ vars.AUDIOTOOL_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5.0.1
